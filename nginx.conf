map $host $maroon_robots {
    default "";
    ~^admin\. "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Robots-Tag $maroon_robots always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag $maroon_robots always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
